<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>sevencore · kirish</title>
  <link rel="icon" type="image/svg+xml" href="/panel/assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="/panel/assets/sevencore.css">
  <script type="module" src="/panel/src/gate.js"></script>
</head>
<body>
  <main class="gate">
    <div class="dotgrid"></div><div class="orbit o2"></div><div class="orbit"></div>
    <form class="gate-card" id="form" novalidate>
      <div class="mark"><span class="glyph" id="glyph"></span><span><b>sevencore</b><small data-t="brand"></small></span></div>
      <h1 data-t="title" data-rich></h1>
      <p data-t="sub"></p>
      <div class="gate-err" id="err" hidden></div>
      <label class="fld"><span data-t="login"></span><input class="in" name="username" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label class="fld"><span data-t="pw"></span><span class="eye"><input class="in" name="password" type="password" autocomplete="current-password">
        <button type="button" id="eye" aria-label="show"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></span></label>
      <button class="btn go" id="go" type="submit" data-t="enter"></button>
      <div class="gate-foot"><span data-t="foot"></span><span class="langs" id="langs" style="width:132px"></span></div>
    </form>
  </main>
</body>
</html>
