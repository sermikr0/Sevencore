# Render Blueprint: Dashboard -> Blueprints -> New Blueprint Instance -> pick this repo.
# Creates one Postgres database and one Docker web service (panel + Telegram Mini App + bot).
databases:
  - name: sevencore-db
    databaseName: sevencore
    user: sevencore
    plan: basic-256mb          # "free" works for a trial but Render deletes free databases after 30 days
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []            # no access from the internet; only the web service (private network)

services:
  - type: web
    name: sevencore
    runtime: docker
    plan: starter              # free instances sleep after 15 min idle, which stops the bot
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sevencore-db
          property: connectionString
      - key: BOT_TOKEN            # from @BotFather, asked once when the Blueprint is created
        sync: false
      - key: ADMIN_PASSWORD       # first Super Admin password (10+ characters), asked once
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_CHAT_IDS       # optional: Telegram chat ids that get every check-in/out
        value: ""
      - key: APP_TZ
        value: Asia/Tashkent
      - key: GEOFENCE_LAT         # office location: change to your office
        value: "41.280101"
      - key: GEOFENCE_LNG
        value: "69.251403"
      - key: GEOFENCE_RADIUS_M
        value: "100"
      - key: CHECKOUT_GEOFENCE
        value: "0"
      - key: CHECKIN_EARLY_MIN
        value: "45"
      - key: LATE_GRACE_MIN
        value: "5"
      - key: MIN_GAP_MIN
        value: "2"
      - key: FACE_THRESHOLD
        value: "0.48"
      - key: LIVENESS
        value: "1"
      - key: LIVENESS_TURN
        value: "0.14"
