# Render Blueprint: Dashboard -> Blueprints -> New Blueprint Instance -> pick this repo.
# Creates one Postgres database and one Docker web service (panel + Telegram Mini App + bot).
databases:
  - name: sevencore-db
    databaseName: sevencore
    user: sevencore
    plan: basic-256mb          # "free" works for a trial but Render deletes free databases after 30 days
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []            # no access from the internet; only the web service (private network)

services:
  - type: web
    name: sevencore
    runtime: docker
    plan: starter              # free instances sleep after 15 min idle, which stops the bot
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sevencore-db
          property: connectionString
      - key: BOT_TOKEN            # from @BotFather, asked once when the Blueprint is created
        sync: false
      - key: ADMIN_PASSWORD       # first Super Admin password (10+ characters), asked once
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_CHAT_IDS       # optional: Telegram chat ids that get every check-in/out
        value: ""
      - key: APP_TZ
        value: Asia/Tashkent
      - key: GEOFENCE_LAT         # office (Yandex point 41.279986, 69.251817)
        value: "41.279986"
      - key: GEOFENCE_LNG
        value: "69.251817"
      - key: GEOFENCE_RADIUS_M    # check-in and check-out only within 300 m
        value: "300"
      - key: GPS_ALLOWANCE_M      # no extra metres for GPS inaccuracy
        value: "0"
      - key: CHECKOUT_GEOFENCE
        value: "1"
      - key: CHECKIN_EARLY_MIN    # check-in opens 2 h before the shift start
        value: "120"
      - key: CHECKIN_LATE_MAX_MIN # check-in closes 15 min after the shift start
        value: "15"
      - key: CHECKOUT_EARLY_MIN   # check-out opens exactly at the shift end
        value: "0"
      - key: CHECKOUT_WINDOW_MIN  # and stays open 2 h
        value: "120"
      - key: LATE_GRACE_MIN       # "late" after 5 min; the panel reports use the same 5 min (build_site.py)
        value: "5"
      - key: MIN_GAP_MIN
        value: "2"
      - key: FACE_THRESHOLD
        value: "0.48"
      - key: LIVENESS
        value: "1"
      - key: LIVENESS_TURN
        value: "0.14"
