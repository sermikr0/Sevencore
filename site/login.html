<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sevencore — Sign in</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>
  <main class="wrap">
    <form class="card" id="login" novalidate>
      <div class="brand">
        <img src="/logo2.png" alt="" class="logo">
        <h1>SEVENCORE Attendance</h1>
        <p class="tag">DISPATCH CONSOLE ACCESS</p>
      </div>

      <label class="field">
        <span class="label">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>
          Username
        </span>
        <input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus
               placeholder="Enter your username">
      </label>

      <label class="field">
        <span class="label">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>
          Password
        </span>
        <span class="pw">
          <input name="password" type="password" autocomplete="current-password" required placeholder="Enter your password">
          <button type="button" class="eye" id="toggle" aria-label="Show password">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>
          </button>
        </span>
      </label>

      <div class="error" id="error" role="alert" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5M12 16v.2"/></svg>
        <span id="error-text"></span>
      </div>

      <button class="submit" type="submit" id="submit">
        <span>Sign In</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>

      <div class="roles">
        <span><i class="dot red"></i>Admins → Dispatch dashboard</span>
        <span><i class="dot blue"></i>Managers → Team portal</span>
      </div>
    </form>
    <p class="foot">Employees check in from the attendance app in Telegram.</p>
  </main>
  <script src="/login.js"></script>
</body>
</html>
