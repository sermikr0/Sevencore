# OpSector local data layer: Postgres + PostgREST (the REST engine Supabase uses).
# Both bind to 127.0.0.1 only. The app server (server/app.py) is the single client.
name: opsector-local
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: opsector
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opsector"]
      interval: 3s
      timeout: 3s
      retries: 20
  rest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/opsector
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_OPENAPI_MODE: disabled
      PGRST_DB_MAX_ROWS: "5000"
    ports:
      - "127.0.0.1:55441:3000"
volumes:
  pgdata:
